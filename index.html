<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finanzas · Control Mensual</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
<meta name="description" content="App para llevar los gastos e ingresos del mes, del hogar y del trabajo, con vencimientos y resumen. Los datos quedan solo en tu dispositivo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Control Mensual · Gastos e ingresos del mes">
<meta property="og:description" content="App para llevar los gastos e ingresos del mes, del hogar y del trabajo, con vencimientos y resumen. Los datos quedan solo en tu dispositivo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F1F3F6; --text:#0F172A; --muted:#5B6576;
  --border:#E5E7EB; --primary:#0F766E; --undo-ink:#5EEAD4; --primary-ink:#FFFFFF; --pos:#047857; --neg:#C81E1E; --warn:#B45309; --chip-mix:52%;
  --hero-a:#0F172A; --hero-b:#16384A; --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --radius:18px;
}
[data-theme=dark]{
  --bg:#0A0E13; --surface:#121820; --surface-2:#19212B; --text:#E6EDF3; --muted:#8B98A5;
  --border:#232E3A; --primary:#2DD4BF; --undo-ink:#0F766E; --primary-ink:#04201D; --pos:#34D399; --neg:#F87171; --warn:#FBBF24;
  --hero-a:#0F1B26; --hero-b:#123B3A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#0A0E13; --surface:#121820; --surface-2:#19212B; --text:#E6EDF3; --muted:#8B98A5;
    --border:#232E3A; --primary:#2DD4BF; --undo-ink:#0F766E; --primary-ink:#04201D; --pos:#34D399; --neg:#F87171; --warn:#FBBF24;
    --hero-a:#0F1B26; --hero-b:#123B3A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}

/* App bar */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding:calc(12px + env(safe-area-inset-top)) 0 12px}
.appbar .wrap{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#0EA5E9);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.mes-btn{background:none;border:none;padding:0;color:var(--muted);font-size:13px;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.mes-btn:hover{color:var(--text)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--primary);color:var(--primary-ink);
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 40%,transparent)}
.btn.block{width:100%;justify-content:center;padding:13px}
.btn:active{transform:scale(.98)}

/* Hero */
.hero{margin-top:6px;border-radius:24px;padding:24px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,var(--hero-b) 0%,var(--hero-a) 60%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(45,212,191,.25),transparent 70%)}
.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;position:relative;z-index:1}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.hero-num{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px;line-height:1.05}
.hero-num.neg{color:#FCA5A5}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.12)}
.pill.pos{color:#6EE7B7}.pill.neg{color:#FCA5A5}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{transition:stroke-dasharray .5s ease,opacity .3s}
.donut circle{transition:stroke-dasharray .4s ease,stroke-dashoffset .4s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:17px;line-height:1}
.ring .lbl small{display:block;font-size:9.5px;font-weight:600;opacity:.65;letter-spacing:.05em;margin-top:3px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.hs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.hs span{display:block;font-size:11.5px;opacity:.65;font-weight:600}
.hs b{display:block;font-size:17px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:18px;position:relative;z-index:1}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2DD4BF,#34D399);transition:width .5s ease}
.bar-cap{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-top:8px;position:relative;z-index:1}

/* Nav */
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;margin:20px 0 16px}
.nav button{flex:1;border:none;background:none;border-radius:10px;padding:9px 8px;font-weight:700;font-size:13.5px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:7px}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:var(--text);color:var(--bg)}
@media (max-width:720px){
  .nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));margin:0;z-index:30;
    box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:18px;padding:6px}
  .hero{margin-bottom:16px}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:8px 4px}
  .nav button.on{background:var(--surface-2);color:var(--primary)}
  .hero-num{font-size:34px}
  .hs b{font-size:15px}
  .hide-sm{display:none}
}

/* Cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.grid .card{margin-bottom:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:15.5px;font-weight:800;margin:0;letter-spacing:-.01em}
.card-h .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.link{background:none;border:none;color:var(--primary);font-weight:700;font-size:13px;padding:4px}

/* Rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--border)}
.row:first-child{border-top:none}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:none;flex:none;display:grid;place-items:center;padding:0;transition:.15s}
.check svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check:hover{border-color:var(--pos)}
.is-done .check{background:var(--pos);border-color:var(--pos)}
.is-done .check svg{opacity:1}
.row-main{flex:1;min-width:0;cursor:pointer}
.row-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-done .row-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.row-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.row-amt{text-align:right;cursor:pointer;flex:none}
.amt{font-weight:800;font-size:15px;letter-spacing:-.01em}
.amt.pos{color:var(--pos)}
.amt-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.amt-sub .up{color:var(--neg)}.amt-sub .down{color:var(--pos)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) var(--chip-mix,85%),var(--text))}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:color-mix(in srgb,var(--warn) 82%,var(--text))}
.tag.danger{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.x{background:none;border:none;color:var(--muted);width:30px;height:30px;border-radius:8px;flex:none;font-size:16px}
.x:hover{background:var(--surface-2);color:var(--neg)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.add-row{width:100%;margin-top:8px;border:1.5px dashed var(--border);background:none;border-radius:12px;padding:11px;font-weight:700;color:var(--muted);font-size:13.5px}
.add-row:hover{color:var(--primary);border-color:var(--primary)}

.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Calendario del mes (v2.0) */
.vista-bar{display:flex;justify-content:flex-end;margin:0 0 12px}
.cal-sem,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-sem{margin-bottom:4px}
.cal-sem span{text-align:center;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.cal-d{position:relative;min-width:0;height:58px;border:1.5px solid transparent;border-radius:11px;background:none;color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:6px 2px 4px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.cal-d:hover{border-color:var(--border)}
.cal-d.con{background:var(--surface-2)}
.cal-d.hoy .cal-n{color:var(--primary);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.cal-d.sel{background:color-mix(in srgb,var(--primary) 12%,var(--surface));border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.cal-n{font-size:13.5px;font-weight:800;line-height:1}
.cal-dots{display:flex;gap:3px;height:6px}
.cal-dots i,.cal-ley i{width:7px;height:7px;border-radius:50%;display:inline-block;background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
i.ok{background:var(--pos);box-shadow:none} i.pronto,i.hoy{background:var(--warn);box-shadow:none} i.vencido{background:var(--neg);box-shadow:none}
.cal-amt{font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%;letter-spacing:-.02em}
.cal-d.e-vencido .cal-amt{color:var(--neg)}
.cal-d.e-ok .cal-amt{color:var(--pos)}
.cal-ley{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 2px;font-size:12px;color:var(--muted);font-weight:600}
.cal-ley span{display:inline-flex;align-items:center;gap:6px}
@media (min-width:721px){.cal-d{height:70px}.cal-n{font-size:15px}.cal-amt{font-size:12px}}

/* Donut */
.donut-wrap{display:flex;gap:18px;align-items:center}
.donut{position:relative;width:140px;height:140px;flex:none}
.donut svg{width:140px;height:140px;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-size:16px;font-weight:800;display:block}
.donut .c span{font-size:11px;color:var(--muted);font-weight:600}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.lg span{flex:1;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-weight:800}
.lg em{font-style:normal;color:var(--muted);font-size:11.5px;width:34px;text-align:right}
@media (max-width:420px){.donut-wrap{flex-direction:column;align-items:stretch}.donut{margin:0 auto}}

/* Movimientos form */
.qa{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto;gap:8px}
@media (max-width:720px){.qa{grid-template-columns:1fr 1fr}.qa .full{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.inp{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:11px;padding:11px 12px;font-size:15px;outline:none;transition:.15s}
.inp:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.inp.money{font-weight:700}
.day-h{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 4px 4px;display:flex;justify-content:space-between}

/* History */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-weight:600;font-family:inherit}
.legend-inline{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend-inline i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.h-item{border-top:1px solid var(--border)}
.h-item:first-child{border-top:none}
.h-head{display:flex;align-items:center;gap:12px;padding:13px 4px;cursor:pointer}
.h-mes{flex:1;font-weight:800}
.h-mes small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.h-detail{padding:0 4px 14px;display:flex;flex-direction:column;gap:6px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:721px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:721px){.sheet{border-radius:22px}}
.sheet h3{margin:0 0 16px;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sheet .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .fields .full{grid-column:1/-1}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions .btn{flex:1;justify-content:center;padding:13px}
.grabber{width:40px;height:4px;border-radius:9px;background:var(--border);margin:-8px auto 14px}
@media (min-width:721px){.grabber{display:none}}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 10px;border:none;background:none;border-radius:12px;text-align:left;font-weight:700}
.menu-item:hover{background:var(--surface-2)}
.menu-item small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.menu-item .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.menu-item .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.summary-box{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.summary-box div{display:flex;justify-content:space-between}
.summary-box b{font-weight:800}
.alert{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:13.5px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-weight:600}

.nudge{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--warn)}
.nudge .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.nudge .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nudge-txt{flex:1;min-width:0}
.nudge-alt{display:inline-block;margin-top:10px;padding:0;border:none;background:none;color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
textarea.inp{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.4;word-break:break-all}
.form-err{margin-top:10px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
.form-ok{margin-top:10px;font-size:13px;font-weight:600;color:var(--pos)}
.f-msg{--mc:var(--neg);font-size:12.5px;font-weight:600;line-height:1.35;color:var(--mc);display:flex;gap:5px;align-items:flex-start}
.f-msg::before{content:"!";flex:none;width:15px;height:15px;border-radius:50%;background:var(--mc);color:var(--surface);font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.f-msg.warn{--mc:color-mix(in srgb,var(--warn) 78%,var(--text))}
.inp[aria-invalid=true]{border-color:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 14%,transparent)}
.inp.avisada{border-color:var(--warn)}
.sheet-note{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.nudge-txt b{display:block;font-size:15px;margin-bottom:2px}
.nudge-txt p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.nudge-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nudge-act .btn{padding:9px 14px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:60;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast{display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box}
.toast.show.has-undo{pointer-events:auto;padding:6px 6px 6px 18px}
.toast-undo{background:none;border:0;color:var(--undo-ink);font:inherit;font-weight:800;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.toast-undo:hover,.toast-undo:focus-visible{background:color-mix(in srgb,var(--undo-ink) 18%,transparent);outline:none}

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const fmt = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const money = n => fmt.format(Math.round(Number(n)||0));
const compact = n => { n=Number(n)||0; const a=Math.abs(n);

  if(a>=1e3) return '$'+Math.round(n/1e3)+'k'; return '$'+Math.round(n); };
const numStr = n => (n===''||n==null) ? '' : Number(n).toLocaleString('es-AR',{maximumFractionDigits:2});
/* leerMonto(texto) → {n} (número o '' si está vacío) o {error}. Miles con punto, centavos con coma (o punto + 1-2 cifras). */
const MONTO_MAX = 1e10;
function leerMonto(raw){
  let s=String(raw??'').replace(/\s|\$|ars/gi,'');
  if(!s) return {n:''};
  const ej='Escribí solo números, por ejemplo 12.500 o 12.500,50';
  if(/[^\d.,-]/.test(s)) return {error:ej};
  let neg=false; if(s.startsWith('-')){ neg=true; s=s.slice(1); }
  if(s.includes('-')) return {error:ej};
  s=s.replace(/[.,]+$/,'');
  if(!/\d/.test(s)) return {error:ej};
  let ent=s, dec='';
  const c=s.split(',');
  if(c.length>2){
    if(s.includes('.') || !c[0] || c[0].length>3 || c.slice(1).some(g=>g.length!==3)) return {error:'Revisá las comas: los centavos van con una sola coma (12.500,50)'};
    ent=c.join('');
  } else if(c.length===2){
    ent=c[0]; dec=c[1];
    if(dec.includes('.')) return {error:'Revisá el formato: los miles van con punto y los centavos con coma (12.500,50)'};
    if(dec.length===3 && !ent.includes('.') && ent.length<=3) return {error:`¿Quisiste decir ${ent}.${dec}? Los miles van con punto; los centavos, con coma y 2 cifras`};
    if(dec.length>2) return {error:'Los centavos van con hasta 2 cifras'};
  } else {
    const p=s.split('.');
    if(p.length===2 && p[1].length>=1 && p[1].length<=2){ ent=p[0]; dec=p[1]; }
  }
  if(ent.includes('.')){
    const g=ent.split('.');
    if(!g[0] || g[0].length>3 || g.slice(1).some(x=>x.length!==3)) return {error:'Revisá los puntos: los miles van de a 3 cifras (1.250.000)'};
    ent=g.join('');
  }
  if(ent==='') ent='0';
  if(!/^\d+$/.test(ent) || (dec && !/^\d+$/.test(dec))) return {error:ej};
  const n=Number(ent+(dec?'.'+dec:''));
  if(neg && n>0) return {error:'El monto no puede ser negativo'};
  if(n>MONTO_MAX) return {error:'Es una cifra demasiado grande: revisá si sobra algún cero'};
  return {n};
}
const parseMonto = s => { const r=leerMonto(s); return r.error ? '' : r.n; };

/* ---------- Almacenamiento (desde v1.3: IndexedDB + espejo en localStorage) ----------
   Cada guardado escribe en las dos copias y deja una marca 'rev' (fecha en ms).
   Al abrir, gana la copia con 'rev' más nueva (empate o sin marcas: localStorage, la de siempre),
   y la otra se vuelve a sincronizar. Si IndexedDB no está disponible, se sigue solo con localStorage. */
const PREFIX = 'control-mensual:';
const IDB_NAME = 'control-mensual', IDB_STORE = 'kv';
const store = {cache:{}, idb:null, modo:'local', recuperado:null};
function idbOpen(){
  return new Promise(res=>{
    let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    setTimeout(()=>fin(null), 2500);
    try{
      if(!window.indexedDB) return fin(null);
      const rq=indexedDB.open(IDB_NAME,1);
      rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch(e){} };
      rq.onsuccess=()=>{ const db=rq.result; db.onversionchange=()=>{ db.close(); store.idb=null; }; if(done) db.close(); fin(db); };
      rq.onerror=()=>fin(null); rq.onblocked=()=>fin(null);
    }catch(e){ fin(null); }
  });
}
function idbAll(db){
  return new Promise(res=>{
    try{
      const out={}, tx=db.transaction(IDB_STORE,'readonly'), os=tx.objectStore(IDB_STORE), rq=os.openCursor();
      rq.onsuccess=()=>{ const c=rq.result; if(c){ out[c.key]=c.value; c.continue(); } };
      tx.oncomplete=()=>res(out); tx.onerror=tx.onabort=()=>res(null);
    }catch(e){ res(null); }
  });
}
function idbPut(entries){
  const db=store.idb; if(!db) return Promise.resolve(false);
  return new Promise(res=>{
    try{
      const tx=db.transaction(IDB_STORE,'readwrite'), os=tx.objectStore(IDB_STORE);
      for(const [k,v] of entries) os.put(v,k);
      tx.oncomplete=()=>res(true); tx.onerror=tx.onabort=()=>res(false);
    }catch(e){ res(false); }
  });
}
function lsGet(key){ try{ return localStorage.getItem(PREFIX+key); }catch(e){ return null; } }
function lsSet(key,value){ try{ localStorage.setItem(PREFIX+key,value); return true; }catch(e){ return false; } }
function lsKeys(){ const r=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(PREFIX)) r.push(k.slice(PREFIX.length)); } }catch(e){} return r; }
async function storeInit(){
  if (typeof window.storage !== 'undefined') return;
  const ls={}; lsKeys().forEach(k=>{ ls[k]=lsGet(k); });
  const db=await idbOpen(); let idb=null;
  if(db){ idb=await idbAll(db); if(idb){ store.idb=db; store.modo='doble'; } else { try{ db.close(); }catch(e){} } }
  const revLs=Number(ls.rev)||0, revIdb=Number(idb?.rev)||0;
  const usarIdb = idb && revIdb > revLs;
  const src = usarIdb ? idb : ls;
  store.cache = {...src};
  if(usarIdb){
    const tieneDatos = k=>!!ls[k];
    store.recuperado = ['config','current','history'].some(tieneDatos) ? 'idb-mas-nueva' : 'local-vacio';
    for(const [k,v] of Object.entries(idb)) if(typeof v==='string') lsSet(k,v);
  } else if(store.idb){
    // Sincronizar la base interna con lo que hay en localStorage (incluye la primera vez desde v1.2).
    const ent=Object.entries(ls).filter(([k,v])=>typeof v==='string');
    if(ent.length) await idbPut(ent);
  }
}
async function storeGet(key){
  if (typeof window.storage !== 'undefined'){
    try{ const r = await window.storage.get(key,false); return r ? r.value : null; }catch(e){ return null; }
  }
  if(key in store.cache) return store.cache[key];
  return lsGet(key);
}
async function storeSet(key, value){ return storeSetMany([[key,value]]); }
async function storeSetMany(entries){
  if (typeof window.storage !== 'undefined'){
    for(const [k,v] of entries){ try{ await window.storage.set(k,v,false); }catch(e){} }
    return;
  }
  const rev=String(Date.now()); entries=[...entries,['rev',rev]];
  let okLs=true;
  for(const [k,v] of entries){ store.cache[k]=v; if(!lsSet(k,v)) okLs=false; }
  if(!okLs) lsSet('rev','0'); // si el espejo local quedó incompleto, que no le gane a IndexedDB
  if(store.idb){ const ok=await idbPut(entries); if(!ok){ store.modo='local'; } }
}

let config, current, hist;
const ui = {tab:'resumen', filtro:'todos', vistaFijos:'lista', diaCal:null, openHist:null, novedad:false, respaldo:null};

/* ---------- Aviso de respaldo (v1.4) ----------
   Vive en meta.respaldo = {ultimo: ms|null, base: ms, pospuesto: ms|null}. No es parte de los datos
   (no cambia el esquema): ultimo = última descarga de respaldo en este dispositivo; base = desde cuándo
   se cuenta si nunca hubo descarga (0 si ya había datos al actualizar: avisa enseguida); pospuesto =
   «Más tarde» silencia el aviso hasta esa fecha. */
const RESPALDO_DIAS = 7, RESPALDO_POSPONER_DIAS = 3, DIA_MS = 864e5;
async function metaPatch(fn){
  let meta={}; try{ meta=JSON.parse(await storeGet('meta')||'{}')||{}; }catch(e){ meta={}; }
  fn(meta); await storeSet('meta', JSON.stringify(meta)); return meta;
}
function respaldoEstado(now=Date.now()){
  const r=ui.respaldo; if(!r) return null;
  const dias = r.ultimo ? Math.floor((now-r.ultimo)/DIA_MS) : null;
  const vencido = r.ultimo ? dias>=RESPALDO_DIAS : (now-(Number(r.base)||0))>=RESPALDO_DIAS*DIA_MS;
  const pospuesto = r.pospuesto && now < r.pospuesto;
  return {dias, nunca:!r.ultimo, mostrar: vencido && !pospuesto};
}
function respaldoTexto(){
  const e=respaldoEstado(); if(!e) return 'Guarda todos tus datos en un archivo .json';
  if(e.nunca) return 'Todavía no descargaste ninguno en este dispositivo';
  return 'Último: '+(e.dias===0?'hoy':e.dias===1?'ayer':`hace ${e.dias} días`);
}
function respaldoAviso(){
  const e=respaldoEstado(); if(!e || !e.mostrar) return '';
  const titulo = e.nunca ? 'Todavía no descargaste un respaldo' : `Hace ${e.dias} días que no descargás un respaldo`;
  return `<div class="card nudge" id="aviso-respaldo" role="status">
    <span class="ic">${svg('download')}</span>
    <div class="nudge-txt"><b>${titulo}</b>
      <p>Tus datos viven solo en este navegador. Un archivo de respaldo te cuida si se borra o cambiás de equipo.</p>
      <div class="nudge-act"><button class="btn" data-act="respaldo-ya">Descargar respaldo</button><button class="btn ghost" data-act="respaldo-luego">Más tarde</button></div>
      <button type="button" class="nudge-alt" data-act="respaldo-copiar">¿No te deja descargar? Copialo como texto</button>
    </div></div>`;
}

/* ---------- Esquema de datos y migraciones ----------
   schemaVersion 0 = datos de la v1.0 (sin número de esquema).
   Para cambiar la estructura: subir SCHEMA_VERSION y agregar MIGRATIONS[n](d) que
   reciba {config,current,history} del esquema n-1 y devuelva el del esquema n. */
const SCHEMA_VERSION = 1;
const MIGRATIONS = {
  1(d){
    const c=d.config||{}; c.ingresos=Array.isArray(c.ingresos)?c.ingresos:[]; c.gastos=Array.isArray(c.gastos)?c.gastos:[];
    c.gastos.forEach(x=>{ if(!x.id) x.id=uid(); if(!x.categoria) x.categoria=guessCat(x.nombre); if(x.vence==null) x.vence=''; if(x.nota==null) x.nota=''; });
    c.ingresos.forEach(x=>{ if(!x.id) x.id=uid(); if(x.nota==null) x.nota=''; });
    const cur=d.current||{}; cur.mesLabel ||= nowLabel(); cur.gastos ||= {}; cur.ingresos ||= {};
    cur.movimientos = Array.isArray(cur.movimientos)?cur.movimientos:[];
    cur.movimientos.forEach(m=>{ if(!m.id) m.id=uid(); if(!m.categoria) m.categoria='otros'; if(!m.fecha) m.fecha=todayISO(); if(m.ts==null) m.ts=0; });
    const h=(Array.isArray(d.history)?d.history:[]).map(x=>({...x, ingresos:Number(x.ingresos)||0, gastos:Number(x.gastos)||0, ahorro:Number(x.ahorro)||0}));
    return {config:c, current:cur, history:h};
  }
};
function migrateData(d, from){
  from = Number(from)||0;
  for(let v=from+1; v<=SCHEMA_VERSION; v++){ if(MIGRATIONS[v]) d = MIGRATIONS[v](d); }
  return d;
}

function normalize(){
  config.ingresos ||= []; config.gastos ||= [];
  config.gastos.forEach(x=>{ x.categoria ||= guessCat(x.nombre); if(x.vence==null) x.vence=''; });
  current.gastos ||= {}; current.ingresos ||= {}; current.movimientos ||= [];
  config.gastos.forEach(x=>{ current.gastos[x.id] ||= {real:'',pagado:false}; });
  config.ingresos.forEach(x=>{ current.ingresos[x.id] ||= {real:'',cobrado:false}; });
  if(!Array.isArray(hist)) hist=[];
}
async function load(){
  try{ await storeInit(); }catch(e){}
  const raw={config:await storeGet('config'), current:await storeGet('current'), history:await storeGet('history')};
  const hadData = !!(raw.config||raw.current||raw.history);
  let meta={}; try{ meta=JSON.parse(await storeGet('meta')||'{}')||{}; }catch(e){ meta={}; }
  const from = hadData ? (Number(meta.schemaVersion)||0) : SCHEMA_VERSION;
  try{ config = raw.config?JSON.parse(raw.config):DEFAULT_CONFIG(); }catch(e){ config=DEFAULT_CONFIG(); }
  try{ current = raw.current?JSON.parse(raw.current):newMonth(config, nowLabel()); }catch(e){ current=newMonth(config, nowLabel()); }
  try{ hist = raw.history?JSON.parse(raw.history):[]; }catch(e){ hist=[]; }
  try{ const th=await storeGet('theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
  if(from < SCHEMA_VERSION){
    // Copia de seguridad interna, textual, antes de tocar nada (solo la primera vez para ese esquema).
    const key='pre-migracion-esquema-'+from;
    if(!(await storeGet(key))) await storeSet(key, JSON.stringify({guardado:new Date().toISOString(), deVersion:meta.appVersion||'1.0', ...raw}));
    ({config, current, history:hist} = migrateData({config, current, history:hist}, from));
  }
  normalize();
  if(from > SCHEMA_VERSION){ toast('Estos datos son de una versión más nueva de la app: usá el archivo más reciente'); return; }
  await saveAll();
  ui.novedad = hadData && meta.appVersion !== VERSION && !meta.vistoNovedades?.includes(VERSION);
  const rsp = (meta.respaldo && typeof meta.respaldo==='object') ? meta.respaldo : {ultimo:null, base: hadData?0:Date.now(), pospuesto:null};
  ui.respaldo = rsp;
  await storeSet('meta', JSON.stringify({...meta, schemaVersion:SCHEMA_VERSION, appVersion:VERSION, respaldo:rsp}));
}
async function marcarNovedadesVistas(){
  let meta={}; try{ meta=JSON.parse(await storeGet('meta')||'{}')||{}; }catch(e){}
  const v=new Set(meta.vistoNovedades||[]); v.add(VERSION);
  await storeSet('meta', JSON.stringify({...meta, vistoNovedades:[...v]}));
  ui.novedad=false; render();
}
async function saveAll(){
  await storeSetMany([['config',JSON.stringify(config)],['current',JSON.stringify(current)],['history',JSON.stringify(hist)]]);
}

/* ---------- Cálculos ---------- */
function totals(){
  let ingresos=0, cobrado=0, fijos=0, pagado=0, nPag=0;
  config.ingresos.forEach(x=>{ const s=current.ingresos[x.id]; const v=eff(s.real,x.estimado); ingresos+=v; if(s.cobrado) cobrado+=v; });
  const porCat={};
  config.gastos.forEach(x=>{ const s=current.gastos[x.id]; const v=eff(s.real,x.estimado); fijos+=v;
    if(s.pagado){pagado+=v;nPag++;} porCat[x.categoria]=(porCat[x.categoria]||0)+v; });
  let variables=0;
  current.movimientos.forEach(m=>{ variables+=Number(m.monto)||0; porCat[m.categoria]=(porCat[m.categoria]||0)+(Number(m.monto)||0); });
  const gastos=fijos+variables, ahorro=ingresos-gastos;
  return {ingresos,cobrado,fijos,pagado,nPag,nFijos:config.gastos.length,variables,gastos,ahorro,
    tasa: ingresos? ahorro/ingresos : 0, porCat};
}
function parseMes(label){
  const p=(label||'').trim().split(/\s+/);
  const idx=MESES.findIndex(m=>m.toLowerCase()===(p[0]||'').toLowerCase());
  return [idx, Number(p[1])||new Date().getFullYear()];
}
function venceTag(x, st){
  if(!x.vence) return '';
  const d=Number(x.vence);
  if(st.pagado) return `<span class="tag">Día ${d}</span>`;
  const [m,y]=parseMes(current.mesLabel), now=new Date();
  if(m===now.getMonth() && y===now.getFullYear()){
    const diff=d-now.getDate();
    if(diff<0) return `<span class="tag danger">Vencido · día ${d}</span>`;
    if(diff===0) return `<span class="tag warn">Vence hoy</span>`;
    if(diff<=3) return `<span class="tag warn">Vence en ${diff} día${diff>1?'s':''}</span>`;
  }
  return `<span class="tag">Vence día ${d}</span>`;
}

function ringSVG(p, size=84, stroke=8, color='#2DD4BF', track='rgba(255,255,255,.14)'){

function donut(t){

  if(!entries.length) return `<div class="empty">Sin gastos cargados</div>`;
  const size=140, sw=18, r=(size-sw)/2, C=2*Math.PI*r; let acc=0;

    const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${cat(k).color}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-acc}"/>`;
    acc+=len; return s; }).join('');
  return `<div class="donut-wrap">
    <div class="donut" role="img" aria-label="Gasto total ${money(t.gastos)}: ${entries.slice(0,7).map(([k,v])=>`${cat(k).label} ${Math.round(v/t.gastos*100)}%`).join(', ')}"><svg aria-hidden="true" viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>${arcs}</svg>

}

const DIAS_SEM=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const diasDelMes=(m,y)=>new Date(y,m+1,0).getDate();
function mesCal(){ let [m,y]=parseMes(current.mesLabel); if(m<0){ const d=new Date(); m=d.getMonth(); y=d.getFullYear(); } return [m,y]; }
/* Estado de un vencimiento en el calendario: ok (pagado), vencido, hoy, pronto (≤3 días), pend. Solo el mes en curso usa la fecha de hoy. */
function estadoVence(x, dia, m, y){
  if(current.gastos[x.id]?.pagado) return 'ok';
  const now=new Date();
  if(m===now.getMonth() && y===now.getFullYear()){ const diff=dia-now.getDate();
    if(diff<0) return 'vencido'; if(diff===0) return 'hoy'; if(diff<=3) return 'pronto'; }
  return 'pend';
}
const ESTADO_TXT={ok:'pagado', vencido:'vencido', hoy:'vence hoy', pronto:'vence pronto', pend:'pendiente'};
function vencimientosDelMes(){
  const [m,y]=mesCal(), n=diasDelMes(m,y), porDia={}, sinDia=[];
  config.gastos.forEach(x=>{ const v=Math.round(Number(x.vence));
    if(!v || v<1){ sinDia.push(x); return; } (porDia[Math.min(v,n)] ||= []).push(x); });
  return {m,y,n,porDia,sinDia};
}
function viewCalendario(t){
  const {m,y,n,porDia,sinDia}=vencimientosDelMes(), now=new Date(), esMesHoy=(m===now.getMonth()&&y===now.getFullYear());
  const orden=['vencido','hoy','pronto','pend','ok'];
  let sel=ui.diaCal;
  if(!(sel>=1 && sel<=n)) sel = esMesHoy? now.getDate() : (Number(Object.keys(porDia)[0])||1);
  const offset=(new Date(y,m,1).getDay()+6)%7;
  let celdas='';
  for(let i=0;i<offset;i++) celdas+=`<span aria-hidden="true"></span>`;
  for(let d=1; d<=n; d++){
    const items=porDia[d]||[], ests=items.map(x=>estadoVence(x,d,m,y));
    const est=items.length? orden.find(o=>ests.includes(o)) : '';
    const falta=items.reduce((a,x)=>a+(current.gastos[x.id]?.pagado?0:eff(current.gastos[x.id]?.real,x.estimado)),0);
    const hoy=esMesHoy && d===now.getDate(), dow=DIAS_SEM[new Date(y,m,d).getDay()];
    const lbl=`${dow} ${d}${hoy?', hoy':''}: `+(items.length? `${items.length} vencimiento${items.length>1?'s':''}, ${items.map((x,k)=>`${x.nombre} ${ESTADO_TXT[ests[k]]}`).join(', ')}${falta?`; falta pagar ${money(falta)}`:''}` : 'sin vencimientos');
    celdas+=`<button class="cal-d${items.length?' con e-'+est:''}${hoy?' hoy':''}${d===sel?' sel':''}" data-act="cal-dia" data-i="${d}" aria-pressed="${d===sel}" aria-label="${esc(lbl)}">
      <span class="cal-n" aria-hidden="true">${d}</span>${items.length?`<span class="cal-dots" aria-hidden="true">${ests.slice(0,3).map(e=>`<i class="${e}"></i>`).join('')}</span><span class="cal-amt" aria-hidden="true">${falta?compact(falta):'✓'}</span>`:''}</button>`;
  }
  const delDia=porDia[sel]||[], totDia=delDia.reduce((a,x)=>a+eff(current.gastos[x.id]?.real,x.estimado),0);
  const nVenc=Object.values(porDia).reduce((a,l)=>a+l.length,0);
  const pendMes=Object.values(porDia).flat().filter(x=>!current.gastos[x.id]?.pagado).length;
  return `<div class="card">
    <div class="card-h"><div><h2>Calendario de ${esc(MESES[m])}</h2><div class="sub">${nVenc} vencimiento${nVenc===1?'':'s'} · ${pendMes? `${pendMes} sin pagar` : (nVenc?'todo pagado':'cargá el día en cada gasto')}</div></div></div>
    <div class="cal-sem" aria-hidden="true">${['L','M','M','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cal" role="group" aria-label="Días de ${esc(MESES[m])} ${y}">${celdas}</div>
    <div class="cal-ley" aria-hidden="true"><span><i class="pend"></i>Pendiente</span><span><i class="pronto"></i>Vence pronto</span><span><i class="vencido"></i>Vencido</span><span><i class="ok"></i>Pagado</span></div>
    <div class="day-h" id="cal-dia-h" aria-live="polite"><span>${DIAS_SEM[new Date(y,m,sel).getDay()]} ${sel} de ${MESES[m].toLowerCase()}</span><span>${delDia.length?money(totDia):''}</span></div>
    ${delDia.length? delDia.map(gastoRow).join('') : `<div class="empty" style="padding:14px 10px">Nada vence este día.</div>`}
    ${sinDia.length? `<div class="day-h"><span>Sin día de vencimiento</span><span>${sinDia.length}</span></div>
      <div class="amt-sub" style="padding:0 4px 4px">Tocá un gasto y completá «Vence el día» para verlo en el calendario.</div>${sinDia.map(gastoRow).join('')}` : ''}
  </div>`;
}

/* ---------- Redibujo fino (v1.9) ----------
   render() arma la pantalla nueva aparte y morphHijos() cambia en la página solo lo distinto: los nodos que no
   cambiaron quedan iguales (sin saltos de scroll, el foco y lo que estás escribiendo no se pierden, las barras
   se animan). Las filas llevan data-key (g-, i-, m-, d-, h-) para reconocerlas aunque se agreguen o borren otras.
   Los campos de formulario conservan lo escrito; para vaciarlos hay que usar form.reset(). */
const claveNodo = n => n.nodeType===1 ? n.getAttribute('data-key') : null;
function morphNodo(viejo, nuevo){
  if(viejo.nodeType!==nuevo.nodeType || viejo.nodeName!==nuevo.nodeName || claveNodo(viejo)!==claveNodo(nuevo)){ viejo.replaceWith(nuevo); return; }
  if(viejo.nodeType!==1){ if(viejo.nodeValue!==nuevo.nodeValue) viejo.nodeValue=nuevo.nodeValue; return; }
  for(const a of [...viejo.attributes]) if(!nuevo.hasAttribute(a.name) && !(a.name==='id' && a.value.startsWith('campo-'))) viejo.removeAttribute(a.name);
  for(const a of nuevo.attributes) if(viejo.getAttribute(a.name)!==a.value) viejo.setAttribute(a.name, a.value);
  if(viejo.nodeName==='TEXTAREA') return;
  morphHijos(viejo, nuevo);
}
function morphHijos(padre, nuevoPadre){
  const nuevos=[...nuevoPadre.childNodes], viejos=[...padre.childNodes];
  const conClave=new Map(), sinClave=[];
  viejos.forEach(n=>{ const k=claveNodo(n); if(k!=null) conClave.set(k,n); else sinClave.push(n); });
  let j=0;
  nuevos.forEach((n,i)=>{
    const k=claveNodo(n); let par=null;
    if(k!=null){ par=conClave.get(k)||null; conClave.delete(k); }
    else while(j<sinClave.length){ const c=sinClave[j++]; if(c.nodeName===n.nodeName){ par=c; break; } }
    const ref=padre.childNodes[i]||null;
    if(par){ if(par!==ref) padre.insertBefore(par, ref); morphNodo(par, n); }
    else padre.insertBefore(n, ref);
  });
  while(padre.childNodes.length>nuevos.length) padre.lastChild.remove();
}
/* ---------- Accesibilidad (v1.8) ----------
   claveFoco/enfocarClave: después de redibujar, el foco vuelve al mismo control (no salta al principio).
   asociarLabels: cada <label> de un .field queda unido a su campo (lectores de pantalla y tocar la etiqueta). */
const ATTRS_FOCO=['act','id','tab','f','i'];
function claveFoco(el){
  if(!el || el===document.body || !el.closest) return null;
  const a=el.closest('[data-act]');
  if(a && (a.closest('#app')||a.closest('.appbar'))) return '[data-act]'+ATTRS_FOCO.filter(k=>a.dataset[k]!=null).map(k=>`[data-${k}="${CSS.escape(a.dataset[k])}"]`).join('');
  if(el.id) return '#'+CSS.escape(el.id);
  return null;
}
function enfocarClave(sel){
  if(!sel) return false;
  const el=[...document.querySelectorAll(sel)].find(e=>e.offsetParent!==null || e===document.activeElement);
  if(el){ el.focus({preventScroll:true}); return true; }
  return false;
}
let labelN=0;
function asociarLabels(root){
  root.querySelectorAll('.field').forEach(f=>{
    const l=f.querySelector(':scope > label'), c=f.querySelector(':scope > .inp');
    if(!l || !c) return;
    if(!c.id) c.id='campo-'+(++labelN);
    l.htmlFor=c.id;
  });
}
const FOCUSABLES='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
/* Enter o Espacio activan filas y meses (role=button); Ctrl/Cmd+Z = «Deshacer» mientras se ve el aviso. */
document.addEventListener('keydown', e=>{
  const cd=e.target.closest?.('.cal-d');
  if(cd && !sheetActual && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    const paso={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key], n=document.querySelectorAll('.cal-d').length;
    const d=Math.min(n,Math.max(1,Number(cd.dataset.i)+paso));
    e.preventDefault(); ui.diaCal=d; render(); document.querySelector(`.cal-d[data-i="${d}"]`)?.focus(); return;
  }
  if(sheetActual){
    if(e.key==='Escape'){ e.preventDefault(); sheetActual.close(); return; }
    if(e.key==='Tab'){
      const f=[...sheetActual.form.querySelectorAll(FOCUSABLES)].filter(x=>x.offsetParent!==null);
      if(!f.length){ e.preventDefault(); return; }
      const a=document.activeElement, first=f[0], last=f[f.length-1];
      if(!sheetActual.form.contains(a)){ e.preventDefault(); first.focus(); }
      else if(e.shiftKey && (a===first || a===sheetActual.form)){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && a===last){ e.preventDefault(); first.focus(); }
    }
    return;
  }
  const t=e.target;
  if((e.key==='Enter'||e.key===' ') && t.matches?.('[role=button][data-act]') && !e.repeat){ e.preventDefault(); t.click(); return; }
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && String(e.key||'').toLowerCase()==='z' && toastUndo && !t.matches?.('input,textarea,select')){
    const b=document.getElementById('toast-undo'); if(b){ e.preventDefault(); b.click(); } }
});

/* ---------- Validación en línea ----------
   validarForm(form, errores, avisos): {campo: mensaje}. Con errores no guarda. Los avisos (cifras raras)
   se muestran una vez: si se vuelve a enviar lo mismo, sigue («Guardar igual»). */
function campoMsg(form, name, msg, tipo){
  const inp=form.querySelector(`[name="${name}"]`); if(!inp) return;
  const f=inp.closest('.field')||inp.parentElement;
  const el=document.createElement('div'); el.className='f-msg'+(tipo==='warn'?' warn':''); el.id=`msg-${name}-${uid()}`;
  el.setAttribute('role', tipo==='warn'?'status':'alert'); el.textContent=msg; f.appendChild(el);
  if(tipo==='warn') inp.classList.add('avisada'); else inp.setAttribute('aria-invalid','true');
  inp.setAttribute('aria-describedby', el.id);
}
function limpiarMsgs(form, name){
  const sel = name ? `[name="${name}"]` : '.inp';
  form.querySelectorAll(sel).forEach(inp=>{
    const f=inp.closest('.field')||inp.parentElement; f.querySelectorAll('.f-msg').forEach(m=>m.remove());
    inp.removeAttribute('aria-invalid'); inp.classList.remove('avisada'); inp.removeAttribute('aria-describedby'); });
}
function botonPrincipal(form){ return form.querySelector('button[type=submit]') || form.querySelector('button:not([type])'); }
function quitarAvisos(form){
  if(form.dataset.ok===undefined) return; delete form.dataset.ok;
  form.querySelectorAll('.f-msg.warn').forEach(m=>{ const inp=m.parentElement.querySelector('.inp'); inp?.classList.remove('avisada'); inp?.removeAttribute('aria-describedby'); m.remove(); });
  const b=botonPrincipal(form); if(b?.dataset.label){ b.textContent=b.dataset.label; }
}
function validarForm(form, errores={}, avisos={}){
  const firma=JSON.stringify([...new FormData(form)].map(([k,v])=>[k, form.querySelector(`[name="${k}"]`)?.classList.contains('money') ? leerMonto(v).n : v]));
  const yaAvisado = form.dataset.ok===firma;
  quitarAvisos(form); limpiarMsgs(form);
  const ek=Object.keys(errores);
  if(ek.length){ ek.forEach(k=>campoMsg(form,k,errores[k])); form.querySelector(`[name="${ek[0]}"]`)?.focus(); return false; }
  const ak=Object.keys(avisos);
  if(!ak.length || yaAvisado) return true;
  ak.forEach(k=>campoMsg(form,k,avisos[k],'warn')); form.dataset.ok=firma;
  const b=botonPrincipal(form); if(b){ b.dataset.label ??= b.textContent; b.textContent=(b.dataset.label==='Agregar'?'Agregar':'Guardar')+' igual'; }
  return false;
}
function montoCampo(fd, name, errores, requerido){
  const raw=fd.get(name); const r=leerMonto(raw);
  if(r.error){ errores[name]=r.error; return ''; }
  if(requerido && r.n===''){ errores[name]='Ingresá el monto'; return ''; }
  if(requerido && r.n===0){ errores[name]='El monto tiene que ser mayor a $ 0'; return ''; }
  return r.n;
}
document.addEventListener('input', e=>{
  const form=e.target.closest?.('form'); if(!form || !e.target.name) return;
  if(e.target.getAttribute('aria-invalid')) limpiarMsgs(form, e.target.name);
  quitarAvisos(form);
});

function openSheet({title, body, actions=[]}){
  const root=document.getElementById('sheet-root');

  </form></div>`;
  const scrim=root.firstElementChild, form=scrim.querySelector('form');
  const fondo=[document.querySelector('.appbar'), document.getElementById('app')];
  fondo.forEach(n=>n && (n.inert=true));

  sheetActual={form, close, vuelta};
  asociarLabels(form);
  scrim.addEventListener('click',e=>{ if(e.target===scrim||e.target.closest('[data-close]')) close(); });
  const run=async i=>{ const r=await actions[i].fn(form, new FormData(form)); if(r!==false) close(); };
  form.addEventListener('submit',e=>{ e.preventDefault(); const i=actions.findIndex(a=>a.primary); if(i>=0) run(i); });
  form.querySelectorAll('.actions button[type=button]').forEach(b=>b.onclick=()=>run(Number(b.dataset.i)));
  form.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{ close(); MENU[b.dataset.run](); });
  const first=form.querySelector('input:not([type=hidden])');
  if(first && matchMedia('(min-width:721px)').matches) setTimeout(()=>{ if(sheetActual?.form===form && !form.contains(document.activeElement)) first.focus(); },50);
  else form.focus({preventScroll:true});
}

      reinsertar(config.ingresos, idx, item);
      if(!current.ingresos[id]) current.ingresos[id] = (current===cur && st) ? st : {real:'',cobrado:false};
      await saveAll(); render(); toast('Ingreso recuperado'); }); }});
  actions.push({label:id?'Guardar':'Agregar',primary:true,fn:async(form,fd)=>{
    const nombre=fd.get('nombre').trim(), errores={}, avisos={};
    if(!nombre) errores.nombre='Escribí de dónde viene el ingreso';
    const est=montoCampo(fd,'estimado',errores), real=montoCampo(fd,'real',errores);
    if(est!=='' && real!=='' && est>0 && real>est*10) avisos.real=`Es más de 10 veces el estimado (${money(est)}). ¿Está bien?`;
    if(!validarForm(form, errores, avisos)) return false;
    const data={nombre, estimado:Number(est||0), nota:fd.get('nota').trim()};
    if(id){ Object.assign(x,data); current.ingresos[id].real=real; }
    else { const nid=uid(); config.ingresos.push({id:nid,...data}); current.ingresos[nid]={real,cobrado:false}; }
    await saveAll(); render(); toast(id?'Cambios guardados':'Ingreso agregado');
  }});
  openSheet({title:id?'Editar ingreso':'Nuevo ingreso', actions, body:`<div class="fields">
    <div class="field full"><label>Fuente</label><input class="inp" name="nombre" value="${esc(x.nombre)}" placeholder="Ej: Guardias extra" maxlength="60" autocomplete="off"></div>
    <div class="field"><label>Estimado mensual</label><input class="inp money" name="estimado" inputmode="decimal" value="${numStr(x.estimado)}" placeholder="$ 0"></div>
    <div class="field"><label>Real este mes</label><input class="inp money" name="real" inputmode="decimal" value="${numStr(s.real)}" placeholder="${numStr(x.estimado)||'$ 0'}"></div>
    <div class="field full"><label>Nota</label><input class="inp" name="nota" value="${esc(x.nota)}" placeholder="Opcional"></div>
  </div>`});
}
function sheetCerrar(){
  const t=totals(); const pend=t.nFijos-t.nPag;
  const [m,y]=parseMes(current.mesLabel); let idx=m<0?new Date().getMonth():m, anio=y;
  idx++; if(idx>11){idx=0;anio++;} const next=MESES[idx]+' '+anio;
  openSheet({title:`Cerrar ${esc(current.mesLabel)}`, body:`
    <div class="summary-box">
      <div><span>Ingresos</span><b>${money(t.ingresos)}</b></div>
      <div><span>Gastos fijos</span><b>${money(t.fijos)}</b></div>
      <div><span>Gastos variables</span><b>${money(t.variables)}</b></div>
      <div style="border-top:1px solid var(--border);padding-top:8px"><span>Ahorro</span><b style="color:${t.ahorro>=0?'var(--pos)':'var(--neg)'}">${money(t.ahorro)}</b></div>
    </div>
    ${pend?`<div class="alert">Quedan ${pend} gasto${pend>1?'s':''} fijo${pend>1?'s':''} sin marcar como pagado${pend>1?'s':''}.</div>`:''}
    <p style="color:var(--muted);font-size:13.5px;margin:14px 0 0">Se guarda en el historial y se abre <b style="color:var(--text)">${next}</b> con los mismos ítems fijos, sin montos reales ni movimientos.</p>`,
    actions:[{label:'Cancelar',cls:'ghost',fn:()=>{}},{label:'Cerrar mes',primary:true,fn:async()=>{
      hist.unshift({mesLabel:current.mesLabel, ingresos:t.ingresos, gastos:t.gastos, ahorro:t.ahorro, guardado:new Date().toISOString(),
        detalle:{porCat:t.porCat, fijos:t.fijos, variables:t.variables, pagados:t.nPag, items:t.nFijos}});
      current=newMonth(config,next); ui.tab='resumen'; await saveAll(); render(); toast(`Listo, arrancó ${next}`);
    }}]});
}
function sheetRename(){
  openSheet({title:'Nombre del mes', body:`<div class="field"><label>Mes y año</label><input class="inp" name="mes" value="${esc(current.mesLabel)}" placeholder="Ej: Noviembre 2026" maxlength="40"></div>`,
    actions:[{label:'Guardar',primary:true,fn:async(f,fd)=>{ const v=fd.get('mes').trim(); if(!validarForm(f, v?{}:{mes:'Escribí el mes y el año'})) return false; current.mesLabel=v; await saveAll(); render(); }}]});
}

/* ---------- Menú ---------- */
function download(name, content, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
const MENU = {
  async backup(){ download(`control-mensual-respaldo-${todayISO()}.json`, respaldoJSON(2),'application/json'); toast('Respaldo descargado');
    await marcarRespaldo(); },
  restore(){ document.getElementById('file-import').click(); },
  copiar(){ sheetCopiar(); },
  pegar(){ sheetPegar(); },
  csv(){
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const rows=[['Tipo','Ítem','Categoría','Fecha','Estimado','Real','Estado']];
    config.ingresos.forEach(x=>{const s=current.ingresos[x.id]; rows.push(['Ingreso',x.nombre,'','',x.estimado,s.real,s.cobrado?'Cobrado':'Pendiente']);});
    config.gastos.forEach(x=>{const s=current.gastos[x.id]; rows.push(['Gasto fijo',x.nombre,cat(x.categoria).label,x.vence?`día ${x.vence}`:'',x.estimado,s.real,s.pagado?'Pagado':'Pendiente']);});
    current.movimientos.forEach(m=>rows.push(['Gasto variable',m.desc,cat(m.categoria).label,m.fecha,'',m.monto,'']));
    download(`${current.mesLabel.replace(/\s+/g,'-')}.csv`, '﻿'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv');
    toast('CSV descargado (abre en Excel)');
  },
  novedades(){
    openSheet({title:'Novedades', body:`<div class="nov">${CHANGELOG.map(c=>`<div class="nov-v"><h4><span>Versión ${c.v}${c.v===VERSION?'<span class="badge-new">ACTUAL</span>':''}</span><small>${c.fecha}</small></h4>
      <ul>${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`,
      actions:[{label:'Entendido',primary:true,fn:()=>{}}]});
    if(ui.novedad) marcarNovedadesVistas();
  },
  async theme(){
    const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const n=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=n; await storeSet('theme',n);
  },
  reset(){
    openSheet({title:'Reiniciar mes actual', body:`<p style="color:var(--muted);margin:0">Borra los montos reales, los tildes de pagado y los movimientos de <b style="color:var(--text)">${esc(current.mesLabel)}</b>. No toca el historial ni la lista de ítems.</p>`,
      actions:[{label:'Cancelar',cls:'ghost',fn:()=>{}},{label:'Reiniciar',primary:true,fn:async()=>{ current=newMonth(config,current.mesLabel); await saveAll(); render(); toast('Mes reiniciado'); }}]});
  }
};
/* ---------- Respaldo como texto (v1.5) ----------
   «Copiar respaldo» y «Pegar respaldo»: el mismo contenido que el .json, en una sola línea,
   para cuando el navegador no deja descargar ni elegir archivos. Restaurar (archivo o texto)
   guarda antes una copia interna en la clave 'pre-restauracion'. */
const respaldoJSON = sangria => JSON.stringify({version:2,schemaVersion:SCHEMA_VERSION,appVersion:VERSION,config,current,history:hist},null,sangria||undefined);
async function marcarRespaldo(){
  const ahora=Date.now(); ui.respaldo={...(ui.respaldo||{}), ultimo:ahora, pospuesto:null};
  await metaPatch(m=>{ m.respaldo={...(m.respaldo||{}), ultimo:ahora, pospuesto:null}; }); render();
}
function leerRespaldo(texto){
  // Devuelve {d} o {error}. Tolera texto alrededor (p. ej. pegado desde un mail).
  const t=String(texto||'').trim();
  if(!t) return {error:'Pegá el texto del respaldo en el recuadro.'};
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0) return {error:'Ese texto no parece un respaldo de Control Mensual.'};
  if(b<a) return {error:'El texto está incompleto: copialo de nuevo, entero (empieza con { y termina con }).'};
  let d; try{ d=JSON.parse(t.slice(a,b+1)); }catch(e){ return {error:'El texto está incompleto o se modificó al copiarlo. Probá copiarlo de nuevo, entero.'}; }
  if(!d || typeof d!=='object' || !d.config || !d.current) return {error:'Ese texto no parece un respaldo de Control Mensual.'};
  if((Number(d.schemaVersion)||0) > SCHEMA_VERSION) return {error:'Ese respaldo es de una versión más nueva de la app: abrí la versión más reciente.'};
  return {d};
}
async function aplicarRespaldo(d){
  try{ await storeSet('pre-restauracion', JSON.stringify({guardado:new Date().toISOString(), deVersion:VERSION, config, current, history:hist})); }catch(e){}
  ({config, current, history:hist} = migrateData({config:d.config, current:d.current, history:d.history||[]}, d.schemaVersion||0));
  normalize(); await saveAll(); render();
}
async function copiarTexto(texto, ta){
  try{ if(navigator.clipboard?.writeText){ await navigator.clipboard.writeText(texto); return true; } }catch(e){}
  try{ ta.focus(); ta.select(); ta.setSelectionRange(0, texto.length); if(document.execCommand('copy')) return true; }catch(e){}
  return false;
}
function sheetCopiar(){
  const texto=respaldoJSON();
  const kb=Math.max(1,Math.round(new Blob([texto]).size/1024));
  openSheet({title:'Copiar respaldo', body:`<p class="sheet-note">Copiá este texto y pegalo en un lugar seguro (una nota, un mail o un chat con vos mismo). Para recuperar tus datos, usá «Pegar respaldo» en el menú.</p>
    <textarea class="inp" name="texto" readonly aria-label="Texto del respaldo" spellcheck="false">${esc(texto)}</textarea>
    <p style="font-size:12px;color:var(--muted);margin:6px 2px 0">${config.gastos.length} gastos fijos · ${config.ingresos.length} ingresos · ${current.movimientos.length} movimientos · ${hist.length} meses en el historial · ${kb} KB</p>
    <div class="msg" aria-live="polite"></div>`,
    actions:[{label:'Cerrar',cls:'ghost',fn:()=>{}},{label:'Copiar',primary:true,fn:async form=>{
      const ok=await copiarTexto(texto, form.texto); const msg=form.querySelector('.msg');
      if(!ok){ msg.innerHTML='<div class="form-err">No se pudo copiar solo. Mantené apretado el texto, elegí «Seleccionar todo» y después «Copiar».</div>'; form.texto.focus(); form.texto.select(); return false; }
      await marcarRespaldo(); toast('Respaldo copiado: pegalo en un lugar seguro');
    }}]});
}
function sheetPegar(){
  const puedeLeer = !!navigator.clipboard?.readText;
  const actions=[];
  if(puedeLeer) actions.push({label:'Pegar',cls:'ghost',fn:async form=>{
    const msg=form.querySelector('.msg');
    try{ const t=await navigator.clipboard.readText(); if(t){ form.texto.value=t; msg.innerHTML=''; } else msg.innerHTML='<div class="form-err">El portapapeles está vacío.</div>'; }
    catch(e){ msg.innerHTML='<div class="form-err">El navegador no dejó leer el portapapeles. Mantené apretado el recuadro y elegí «Pegar».</div>'; }
    return false; }});
  actions.push({label:'Restaurar',primary:true,fn:async form=>{
    const msg=form.querySelector('.msg'); const r=leerRespaldo(form.texto.value);
    if(r.error){ msg.innerHTML=`<div class="form-err" role="alert">${esc(r.error)}</div>`; form.texto.focus(); return false; }
    await aplicarRespaldo(r.d); toast('Respaldo restaurado');
  }});
  openSheet({title:'Pegar respaldo', body:`<p class="sheet-note">Pegá el texto que copiaste con «Copiar respaldo». Va a <b style="color:var(--text)">reemplazar los datos de este dispositivo</b> (antes la app guarda una copia interna de lo que tenés ahora).</p>
    <textarea class="inp" name="texto" aria-label="Texto del respaldo" spellcheck="false" autocomplete="off" placeholder='{"version":2,"schemaVersion":…}'></textarea>
    <div class="msg" aria-live="polite"></div>`, actions});
}

function sheetMenu(){
  const it=(k,ic,l,s)=>`<button type="button" class="menu-item" data-run="${k}"><span class="ic">${svg(ic)}</span><span>${l}<small>${s}</small></span></button>`;
  openSheet({title:'Opciones', body:
    it('backup','download','Descargar respaldo',esc(respaldoTexto()))+
    it('restore','upload','Restaurar respaldo','Cargar un archivo .json descargado antes')+
    it('copiar','copy','Copiar respaldo','Como texto, si no te deja descargar')+
    it('pegar','paste','Pegar respaldo','Recuperar datos desde ese texto')+
    it('csv','table','Exportar mes a Excel','CSV con ingresos, fijos y movimientos')+
    it('theme','moon','Cambiar tema','Alternar entre modo claro y oscuro')+
    it('reset','reset','Reiniciar mes actual','Vaciar montos reales y movimientos')+
    it('novedades','spark','Novedades'+(ui.novedad?'<span class="badge-new">NUEVO</span>':''),'Qué cambió en la versión '+VERSION)+
    `<p style="font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin:14px 4px 0">${svg('lock','').replace('<svg','<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"')} Tus datos se guardan solo en este dispositivo. Descargá un respaldo de vez en cuando.</p>
    <p class="store-status" style="font-size:12px;color:var(--muted);margin:6px 4px 0">${store.modo==='doble'?'✓ Doble copia activa en este navegador (base interna + almacenamiento local).':(typeof window.storage!=='undefined'?'Guardado en el almacenamiento de la app.':'Copia única en el almacenamiento local: este navegador no permite la base interna.')}</p>
    <p class="ver-foot">Control Mensual · versión ${VERSION} · datos esquema ${SCHEMA_VERSION}</p>`});
}

/* ---------- Eventos ---------- */
let toastT, toastUndo=null;
const UNDO_MS = 6000; // tiempo para tocar «Deshacer»
/* toast(msg) avisa; toast(msg, fn) agrega «Deshacer», que ejecuta fn una sola vez. */
function toast(msg, undo){
  const el=document.getElementById('toast');
  toastUndo = typeof undo==='function' ? undo : null;
  el.innerHTML = `<span class="toast-msg">${esc(msg)}</span>` + (toastUndo ? '<button type="button" class="toast-undo" id="toast-undo">Deshacer</button>' : '');
  el.classList.toggle('has-undo', !!toastUndo);
  el.setAttribute('role','status');
  el.classList.add('show'); clearTimeout(toastT);
  el.setAttribute('aria-live','polite');
  toastT=setTimeout(()=>{ el.classList.remove('show'); toastUndo=null; el.querySelector('#toast-undo')?.remove(); }, toastUndo ? UNDO_MS : 2200);
  if(toastUndo) el.querySelector('#toast-undo').onclick = async ev=>{
    ev.stopPropagation(); const f=toastUndo; if(!f) return; toastUndo=null; clearTimeout(toastT); el.classList.remove('show'); ev.currentTarget.remove();
    try{ await f(); }catch(err){ toast('No se pudo deshacer'); } };
}
/* Vuelve a poner un elemento borrado en su lugar (si no está ya). */
function reinsertar(arr, idx, item){ if(!item || arr.includes(item)) return; arr.splice(Math.max(0,Math.min(idx,arr.length)),0,item); }

document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.closest('.sheet')) return;
  const id=el.dataset.id;
  switch(el.dataset.act){
    case 'tab': ui.tab=el.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'filtro': ui.filtro=el.dataset.f; render(); break;
    case 'vista': ui.vistaFijos=el.dataset.f; render(); break;
    case 'cal-dia': ui.diaCal=Number(el.dataset.i); render(); break;
    case 'toggle-gasto': current.gastos[id].pagado=!current.gastos[id].pagado; await saveAll(); render(); break;
    case 'toggle-ingreso': current.ingresos[id].cobrado=!current.ingresos[id].cobrado; await saveAll(); render(); break;
    case 'edit-gasto': sheetGasto(id); break;
    case 'add-gasto': sheetGasto(null); break;
    case 'edit-ingreso': sheetIngreso(id); break;
    case 'add-ingreso': sheetIngreso(null); break;
    case 'del-mov': { const cur=current, idx=cur.movimientos.findIndex(m=>m.id===id), item=cur.movimientos[idx];
      current.movimientos=current.movimientos.filter(m=>m.id!==id); await saveAll(); render();
      toast('Movimiento eliminado', async()=>{
        if(current!==cur || !item){ toast('Ya no se puede deshacer: el mes cambió'); return; }
        reinsertar(current.movimientos, idx, item); await saveAll(); render(); toast('Movimiento recuperado'); }); break; }
    case 'rename-mes': sheetRename(); break;
    case 'cerrar-mes': sheetCerrar(); break;
    case 'menu': sheetMenu(); break;
    case 'respaldo-ya': MENU.backup(); break;
    case 'respaldo-copiar': sheetCopiar(); break;
    case 'respaldo-luego': { const hasta=Date.now()+RESPALDO_POSPONER_DIAS*DIA_MS; ui.respaldo={...(ui.respaldo||{}), pospuesto:hasta};
      await metaPatch(m=>{ m.respaldo={...(m.respaldo||{}), pospuesto:hasta}; }); render(); toast('Te lo recuerdo en 3 días'); break; }
    case 'hist-toggle': { const i=Number(el.dataset.i); ui.openHist = ui.openHist===i?null:i; render(); break; }
    case 'hist-del': { const i=Number(el.dataset.i);
      openSheet({title:'Eliminar mes', body:`<p style="color:var(--muted);margin:0">¿Eliminar <b style="color:var(--text)">${esc(hist[i].mesLabel)}</b> del historial? Vas a tener unos segundos para tocar «Deshacer».</p>`,
        actions:[{label:'Cancelar',cls:'ghost',fn:()=>{}},{label:'Eliminar',cls:'danger',fn:async()=>{
          const h=hist, item=hist[i]; hist.splice(i,1); ui.openHist=null; await saveAll(); render();
          toast(`${item.mesLabel} eliminado`, async()=>{
            if(hist!==h){ toast('Ya no se puede deshacer'); return; }
            reinsertar(hist, i, item); await saveAll(); render(); toast(`${item.mesLabel} recuperado`); }); }}]}); break; }
  }
});
document.addEventListener('submit', async e=>{
  if(e.target.id!=='mov-form') return;
  e.preventDefault(); const fd=new FormData(e.target);
  const form=e.target, desc=fd.get('desc').trim(), fecha=String(fd.get('fecha')||''), errores={}, avisos={};
  if(!desc) errores.desc='Escribí qué compraste o pagaste';
  const monto=montoCampo(fd,'monto',errores,true);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha) || isNaN(new Date(fecha+'T12:00:00'))) errores.fecha='Elegí una fecha';
  if(monto!==''){ const ing=totals().ingresos; if(ing>0 && monto>ing) avisos.monto=`Es más que todos los ingresos del mes (${money(ing)}). ¿Está bien?`; }
  const [mm,yy]=parseMes(current.mesLabel);
  if(!errores.fecha && mm>=0 && (+fecha.slice(0,4)!==yy || +fecha.slice(5,7)-1!==mm)) avisos.fecha=`Esta fecha no es de ${current.mesLabel}. ¿La registrás igual en este mes?`;
  if(!validarForm(form, errores, avisos)) return;
  current.movimientos.push({id:uid(), desc, monto:Number(monto), categoria:fd.get('categoria'), fecha, ts:Date.now()});
  form.reset(); delete form.dataset.ok;
  await saveAll(); render(); toast('Gasto registrado');
  document.querySelector('#mov-form [name=desc]')?.focus();
});
document.addEventListener('focusout', e=>{
  if(e.target.classList?.contains('money')){ const r=leerMonto(e.target.value); if(!r.error && r.n!=='' && e.target.value!==numStr(r.n)){ e.target.value=numStr(r.n); } }
});
document.getElementById('file-import').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!d.config||!d.current) throw 0;
    if((Number(d.schemaVersion)||0) > SCHEMA_VERSION){ toast('Ese respaldo es de una versión más nueva de la app'); e.target.value=''; return; }
    await aplicarRespaldo(d); toast('Respaldo restaurado');
  }catch(err){ toast('El archivo no es un respaldo válido'); }
  e.target.value='';
});
matchMedia('(max-width:720px)').addEventListener?.('change',()=>render());

(async()=>{
  try{ await load(); }catch(e){ config=DEFAULT_CONFIG(); current=newMonth(config,nowLabel()); hist=[]; normalize(); }
  render();
  if(store.recuperado==='local-vacio') toast('Recuperamos tus datos desde la copia interna');
  else if(store.recuperado==='idb-mas-nueva') toast('Se usó la copia interna, que era la más reciente');
})();
</script>
